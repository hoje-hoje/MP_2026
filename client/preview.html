<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MP 비주얼 미리보기 · 땅</title>
<style>
  @font-face { font-family: 'Galmuri11'; src: url(assets/fonts/Galmuri11.woff2) format('woff2'); }
  @font-face { font-family: 'Galmuri11'; src: url(assets/fonts/Galmuri11-Bold.woff2) format('woff2'); font-weight: 700; }
  html, body { margin: 0; height: 100%; background: #0b0820; color: #fff; font-family: 'Galmuri11', sans-serif; overflow: hidden; }
  canvas#cv { display: block; width: 100vw; height: 100vh; image-rendering: pixelated; }
  #bar { position: fixed; left: 50%; top: 12px; transform: translateX(-50%); display: flex; gap: 8px; align-items: center; background: rgba(11,8,32,0.85); border: 3px solid #2b2340; box-shadow: 0 0 0 2px #6b4fb3; padding: 8px 12px; font-size: 14px; }
  #bar button { font: inherit; padding: 6px 12px; background: #2b2340; color: #fff; border: 2px solid #6b4fb3; cursor: pointer; }
  #bar button[aria-pressed="true"] { background: #6b4fb3; }
  #bar label { display: flex; gap: 4px; align-items: center; }
  #hint { position: fixed; left: 50%; bottom: 14px; transform: translateX(-50%); background: rgba(11,8,32,0.85); border: 3px solid #2b2340; padding: 6px 14px; font-size: 13px; color: #ffd84d; white-space: nowrap; }
  #tag { position: fixed; left: 16px; top: 14px; font-size: 24px; color: #fff; text-shadow: 2px 2px 0 #2b2340; }
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="tag">NEW</div>
<div id="bar">
  <button id="bOld" type="button" aria-pressed="false">지금 (OLD)</button>
  <button id="bNew" type="button" aria-pressed="true">개편 (NEW)</button>
  <label><input type="checkbox" id="cDither" checked> 디더</label>
  <label><input type="checkbox" id="cOutline" checked> 외곽선</label>
  <label><input type="checkbox" id="cShadow" checked> 그림자</label>
  <label>시간 <select id="sTime"><option value="day">낮</option><option value="dusk">저녁</option><option value="night">밤</option></select></label>
</div>
<div id="hint">방향키 이동 · Space 전환 · 동물 옆에서 E = 잡기</div>
<script>
(async () => {
  window.__stage = 'start';
  const $ = (id) => document.getElementById(id);
  const cv = $('cv'), ctx = cv.getContext('2d');
  const TILE = 32; let W2 = 0, H2 = 0, dpr = 1;
  const loadImg = (src) => new Promise((res, rej) => { const im = new Image(); im.onload = () => res(im); im.onerror = rej; im.src = src; });
  const ART = {};
  const animalsList = ['chick', 'hen', 'pig', 'rabbit', 'cow', 'dog'];
  await Promise.all(Object.entries({ floor: 'assets/ninja/floor.png', village: 'assets/ninja/village.png', water: 'assets/na/water.png', chars: 'assets/na/chars.png' }).map(async ([k, f]) => { ART[k] = await loadImg(f); }));
  await Promise.all(animalsList.map(async (k) => { ART['u_' + k] = await loadImg('assets/user/' + k + '.png'); }));
  window.__stage = 'imgs-done';
  try { await document.fonts.load('11px Galmuri11'); } catch (e) {}
  window.__stage = 'fonts-done';

  // ============================================================ 규칙 엔진
  // 32색 팔레트: 풀·흙·나무·물·하늘·피부·강조. 모든 색은 여기서 고름 (OKLab 가까운 색)
  const PAL_HEX = [
    '#1b1430', '#2b2340', '#3f3659', '#6b6480', '#a39fb3', '#dcd9e6', '#fffaf0', // 어둠 → 밝음 (외곽선·잿빛)
    '#1e3a2a', '#2f6a3a', '#4a9a48', '#6fbf5f', '#a4de6c', '#d9f27a',             // 풀 (어둠 → 밝음)
    '#3a2616', '#6b4428', '#9a6a3e', '#c89a66', '#e8c99a',                         // 나무·흙·모래
    '#163a5a', '#1f5f8a', '#2f8fc0', '#5fbfe6', '#aee8ff',                         // 물·하늘
    '#7a2a2a', '#c23c3c', '#ff6b6b',                                               // 빨강
    '#b8862b', '#f0c23a', '#ffe9a8',                                               // 금·노랑
    '#5a3a7a', '#9a6aff', '#e9d8ff',                                               // 보라
  ];
  const hex2rgb = (h) => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
  const srgb2lin = (c) => { c /= 255; return c <= 0.04045 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4); };
  function oklab(r, g, b) { // sRGB → OKLab (색 거리 재기용)
    const lr = srgb2lin(r), lg = srgb2lin(g), lb = srgb2lin(b);
    const l = Math.cbrt(0.4122214708 * lr + 0.5363325363 * lg + 0.0514459929 * lb), m = Math.cbrt(0.2119034982 * lr + 0.6806995451 * lg + 0.1073969566 * lb), s = Math.cbrt(0.0883024619 * lr + 0.2817188376 * lg + 0.6299787005 * lb);
    return [0.2104542553 * l + 0.793617785 * m - 0.0040720468 * s, 1.9779984951 * l - 2.428592205 * m + 0.4505937099 * s, 0.0259040371 * l + 0.7827717662 * m - 0.808675766 * s];
  }
  const PAL = PAL_HEX.map(hex2rgb), PAL_LAB = PAL.map((c) => oklab(...c));
  // 가장 가까운 팔레트 색: 5비트씩 32×32×32 표를 처음에 한 번 만들어 둠 (픽셀마다 계산 안 함)
  window.__stage = 'lut'; const LUT = new Uint8Array(32 * 32 * 32);
  for (let r = 0; r < 32; r++) for (let g = 0; g < 32; g++) for (let b = 0; b < 32; b++) { const L = oklab(r * 8 + 4, g * 8 + 4, b * 8 + 4); let best = 0, bd = 1e9;
    for (let i = 0; i < PAL_LAB.length; i++) { const p = PAL_LAB[i], d = (L[0] - p[0]) ** 2 + (L[1] - p[1]) ** 2 * 0.6 + (L[2] - p[2]) ** 2 * 0.6; if (d < bd) { bd = d; best = i; } } LUT[(r << 10) | (g << 5) | b] = best; }
  const nearest = (r, g, b) => PAL[LUT[((r >> 3) << 10) | ((g >> 3) << 5) | (b >> 3)]];
  const BAYER = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5]; // 4×4 베이어 (1973)
  // 그림 한 장을 규칙에 통과시킴: (1) 팔레트로 색 줄이기 + 디더 (2) 1픽셀 외곽선 (3) 그림자용 실루엣
  function passRules(src, { dither = true, outline = true, strength = 10 } = {}) {
    const c = document.createElement('canvas'); c.width = src.width + 2; c.height = src.height + 2; const g = c.getContext('2d'); g.imageSmoothingEnabled = false; g.drawImage(src, 1, 1);
    const im = g.getImageData(0, 0, c.width, c.height), d = im.data, w = c.width, h = c.height;
    const on = (x, y) => x >= 0 && y >= 0 && x < w && y < h && d[(y * w + x) * 4 + 3] > 128;
    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) { const i = (y * w + x) * 4; if (d[i + 3] <= 128) { d[i + 3] = 0; continue; }
      const t = dither ? (BAYER[(y & 3) * 4 + (x & 3)] / 16 - 0.5) * strength : 0;
      const [r, gg, b] = nearest(Math.max(0, Math.min(255, d[i] + t)), Math.max(0, Math.min(255, d[i + 1] + t)), Math.max(0, Math.min(255, d[i + 2] + t))); d[i] = r; d[i + 1] = gg; d[i + 2] = b; d[i + 3] = 255; }
    if (outline) { const o = new Uint8Array(w * h); for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) if (!on(x, y) && (on(x + 1, y) || on(x - 1, y) || on(x, y + 1) || on(x, y - 1))) o[y * w + x] = 1;
      for (let k = 0; k < o.length; k++) if (o[k]) { const i = k * 4; d[i] = 27; d[i + 1] = 20; d[i + 2] = 48; d[i + 3] = 255; } }
    g.putImageData(im, 0, 0); return c;
  }
  function silhouette(src, color = 'rgba(27,20,48,0.32)') { const c = document.createElement('canvas'); c.width = src.width; c.height = src.height; const g = c.getContext('2d'); g.drawImage(src, 0, 0); g.globalCompositeOperation = 'source-in'; g.fillStyle = color; g.fillRect(0, 0, c.width, c.height); return c; }
  const crop = (img, x, y, w, h) => { const c = document.createElement('canvas'); c.width = w; c.height = h; c.getContext('2d').drawImage(img, x, y, w, h, 0, 0, w, h); return c; };
  // 빛 방향: 왼쪽 위 → 그림자는 오른쪽 아래로 눕힘
  function drawShadow(g, sil, cx, bottom, k, squash = 0.5, skew = 0.6) { g.save(); g.translate(Math.round(cx), Math.round(bottom)); g.transform(1, 0, skew, squash, 0, 0); g.scale(1, -1); g.drawImage(sil, -sil.width * k / 2, -sil.height * k, sil.width * k, sil.height * k); g.restore(); } // 빛 왼쪽 위 → 실루엣을 발밑에서 아래로 뒤집어 눕힘 (오른쪽 아래로 기울임)

  // ============================================================ 재료 준비 (OLD/NEW 둘 다)
  const SP = { treeA: [0, 96, 64, 48], treeB: [0, 144, 64, 48], midA: [64, 96, 32, 32], midB: [64, 144, 32, 32], bush: [64, 78, 32, 18], stone: [112, 80, 32, 32] };
  window.__stage = 'trees'; const TREES = {}; for (const [k, [x, y, w, h]] of Object.entries(SP)) { const raw = crop(ART.village, x, y, w, h); TREES[k] = { raw, nw: passRules(raw, { strength: 6 }), sil: silhouette(raw) }; }
  window.__stage = 'animals'; const ANIM = {}; for (const k of animalsList) { const raw = ART['u_' + k]; ANIM[k] = { raw, nw: passRules(raw, { strength: 4, outline: false }), sil: silhouette(raw) }; // 동물 그림은 이미 외곽선이 있어서 색만 맞춤 }
  // 바닥 타일: 풀(12행), 모래(5행), 숲(12행 11~14)
  const tileRaw = (cx, cy) => crop(ART.floor, cx * 16, cy * 16, 16, 16);
  const GRASS = [[0, 12], [0, 12], [0, 12], [0, 12], [0, 12], [1, 12], [2, 12], [3, 12]].map(([x, y]) => tileRaw(x, y));
  const SAND = [[0, 5], [0, 5], [1, 5], [2, 5], [3, 5]].map(([x, y]) => tileRaw(x, y));
  // NEW 풀 바닥: 팔레트로 통일 + 풀결 + 흙 자국 (사진 1의 '물결이 모양 따라감' 같은 규칙으로 흙길도 가장자리 따라감)
  const NEW_GRASS = GRASS.map((t) => passRules(t, { outline: false, dither: false }));
  const NEW_SAND = SAND.map((t) => passRules(t, { outline: false, dither: false }));
  // 캐릭터: 닌자(chars.png 0번) 16px 칸, 열 = 방향, 행 = 프레임
  const CHAR = crop(ART.chars, 0, 0, 64, 112), CHAR_NEW = passRules(CHAR, { strength: 4 }), CHAR_SIL = silhouette(CHAR);

  // ============================================================ 장면 (작은 섬: 풀 + 모래 해변 + 물 + 숲)
  window.__stage = 'scene'; const MW = 44, MH = 30; const T = { G: 1, S: 3, W: 4 };
  const hash = (x, y, s = 1) => { let h = (x * 374761393 + y * 668265263 + s * 982451653) | 0; h = (h ^ (h >> 13)) * 1274126177; return ((h ^ (h >> 16)) >>> 0) / 4294967296; };
  const map = new Uint8Array(MW * MH);
  for (let y = 0; y < MH; y++) for (let x = 0; x < MW; x++) { // 비스듬한 해안선 + 호수
    const coast = (x - 30) + (y - 6) * 0.5 + Math.sin(y * 0.7) * 1.6 + Math.sin(x * 0.4) * 1.2;
    const lake = Math.hypot(x - 10, (y - 20) * 1.3);
    map[y * MW + x] = coast > 6 || lake < 4.2 ? T.W : coast > 4.2 || (lake < 5.6) ? T.S : T.G;
  }
  const at = (x, y) => (x < 0 || y < 0 || x >= MW || y >= MH ? T.W : map[y * MW + x]);
  // 나무·바위·풀·꽃 심기
  const objs = [];
  for (let y = 1; y < MH - 1; y++) for (let x = 1; x < MW - 1; x++) { if (at(x, y) !== T.G) continue; const h = hash(x, y, 7);
    if (h < 0.018 && x > 2 && y > 3 && (x + y) % 2 === 0) objs.push({ k: h < 0.006 ? 'treeA' : h < 0.012 ? 'treeB' : 'midA', x: x * TILE + 16, y: y * TILE + 30, seed: h * 99 });
    else if (h < 0.028) objs.push({ k: 'midB', x: x * TILE + 16, y: y * TILE + 30, seed: h * 99 });
    else if (h < 0.045) objs.push({ k: 'bush', x: x * TILE + 16, y: y * TILE + 30, seed: h * 99 });
    else if (h < 0.052) objs.push({ k: 'stone', x: x * TILE + 16, y: y * TILE + 30, seed: h * 99 }); }
  const blocked = new Set(objs.filter((o) => o.k !== 'bush').map((o) => Math.floor(o.y / TILE) * MW + Math.floor(o.x / TILE)));
  const tufts = []; for (let y = 0; y < MH; y++) for (let x = 0; x < MW; x++) if (at(x, y) === T.G) { for (let k = 0; k < 2; k++) { const h = hash(x, y, 20 + k); if (h < 0.3) tufts.push({ x: x * TILE + 3 + hash(x, y, 30 + k) * 26, y: y * TILE + 4 + hash(x, y, 40 + k) * 26, kind: h < 0.06 ? 'flower' : h < 0.1 ? 'flower2' : 'grass', ph: hash(x, y, 50 + k) * 6.28 }); } }
  const animals = []; for (let i = 0; i < 9; i++) { const k = animalsList[i % animalsList.length]; let x = 2, y = 2; for (let tr = 0; tr < 200; tr++) { x = 2 + Math.floor(hash(i, 1 + tr, 90) * (MW - 4)); y = 2 + Math.floor(hash(i, 2 + tr, 90) * (MH - 4)); if (at(x, y) === T.G && !blocked.has(y * MW + x)) break; } animals.push({ k, hx: x * TILE + 16, hy: y * TILE + 28, x: x * TILE + 16, y: y * TILE + 28, seed: i * 13, dir: -1, t: 0, caught: 0 }); }
  const SPD = { chick: 26, hen: 22, pig: 18, rabbit: 40, cow: 14, dog: 36 };
  const player = { x: 12 * TILE + 16, y: 8 * TILE + 16, face: 0, moving: false, frame: 0, ft: 0, catchFx: 0 };
  const keys = new Set(); let MODE = 'new', TIME = 'day', bag = {}, toast = '', toastT = 0;
  const OPT = { dither: true, outline: true, shadow: true };
  addEventListener('keydown', (e) => { keys.add(e.key); if (e.key === ' ') { e.preventDefault(); setMode(MODE === 'new' ? 'old' : 'new'); } if (e.key === 'e' || e.key === 'E') tryCatch(); });
  addEventListener('keyup', (e) => keys.delete(e.key));
  function setMode(m) { MODE = m; $('bOld').setAttribute('aria-pressed', String(m === 'old')); $('bNew').setAttribute('aria-pressed', String(m === 'new')); $('tag').textContent = m === 'new' ? 'NEW' : 'OLD'; $('tag').style.color = m === 'new' ? '#ffd84d' : '#aaa'; }
  $('bOld').onclick = () => setMode('old'); $('bNew').onclick = () => setMode('new');
  for (const k of ['dither', 'outline', 'shadow']) $('c' + k[0].toUpperCase() + k.slice(1)).onchange = (e) => { OPT[k] = e.target.checked; };
  $('sTime').onchange = (e) => { TIME = e.target.value; };
  function tryCatch() { for (const a of animals) if (!a.caught && Math.hypot(a.x - player.x, a.y - player.y) < 44) { a.caught = performance.now(); bag[a.k] = (bag[a.k] || 0) + 1; toast = `${a.k} 을(를) 잡았어요! → 가방 (${Object.values(bag).reduce((s, v) => s + v, 0)}마리)`; toastT = performance.now(); return; } }

  window.__stage = 'draw';
  // ============================================================ 그리기
  function resize() { dpr = Math.min(2, devicePixelRatio || 1); W2 = innerWidth; H2 = innerHeight; cv.width = W2 * dpr; cv.height = H2 * dpr; }
  addEventListener('resize', resize); resize();
  // 물결: 해안선 모양을 따라 흐르는 흰 거품선 (사진 1) + 물 반짝임
  // 물 타일 캐시: 해안 모양(상하좌우 4비트) × 깊음 × 8단계 위상 → 미리 그려 둠 (매 프레임 픽셀 계산 안 함)
  const WPH = 8, WCACHE = new Map();
  function waterFrame(mask, deep, ph) { const key = mask * 16 + (deep ? 8 : 0) + ph; let c = WCACHE.get(key); if (c) return c; c = document.createElement('canvas'); c.width = c.height = TILE; const g = c.getContext('2d'); const t = ph / WPH * 6.283 / 2.2;
    g.fillStyle = deep ? '#1f5f8a' : '#2f8fc0'; g.fillRect(0, 0, TILE, TILE);
    // 잔잔한 물: 가로로 긴 밝은 줄 2~3개가 천천히 흐름 (디더로 가장자리 부드럽게)
    for (let i = 0; i < 3; i++) { const yy = ((i * 11 + Math.round(Math.sin(t * 0.8 + i * 2.1) * 3) + 40) % TILE) & ~1, x0 = (Math.round((t * 9 + i * 13) % TILE)) & ~1, len = 10 + i * 4;
      for (let k = 0; k < len; k += 2) { const xx = (x0 + k) % TILE, b = BAYER[((yy >> 1) & 3) * 4 + ((xx >> 1) & 3)] / 16, edge = k < 4 || k > len - 5; if (edge && b > 0.5) continue; g.fillStyle = deep ? '#2f8fc0' : '#5fbfe6'; g.fillRect(xx, yy, 2, 2); } }
    const k = (Math.sin(t * 2.2) + 1) / 2, off = Math.round(k * 4), N = mask & 1, S = mask & 2, Wd = mask & 4, E = mask & 8;
    const foam = (x0, y0, w, h) => { g.fillStyle = '#aee8ff'; g.fillRect(x0, y0, w, h); if (k > 0.55) { g.fillStyle = '#fffaf0'; g.fillRect(x0, y0, w === TILE ? TILE : 2, h === TILE ? TILE : 2); } };
    if (N) foam(0, off, TILE, 3); if (S) foam(0, TILE - 3 - off, TILE, 3); if (Wd) foam(off, 0, 3, TILE); if (E) foam(TILE - 3 - off, 0, 3, TILE);
    g.fillStyle = '#c89a66'; if (N) g.fillRect(0, 0, TILE, 1); if (Wd) g.fillRect(0, 0, 1, TILE);
    WCACHE.set(key, c); return c; }
  function waterTile(g, x, y, px, py, t, isNew) {
    const land = (a, b) => at(a, b) !== T.W; const N = land(x, y - 1), S = land(x, y + 1), Wd = land(x - 1, y), E = land(x + 1, y);
    if (!isNew) { g.fillStyle = '#4fb4e8'; g.fillRect(px, py, TILE, TILE); if (N || S || Wd || E) { g.fillStyle = '#9fe0ff'; g.fillRect(px, py, TILE, N ? 3 : 0); g.fillRect(px, py + TILE - 3, TILE, S ? 3 : 0); g.fillRect(px, py, Wd ? 3 : 0, TILE); g.fillRect(px + TILE - 3, py, E ? 3 : 0, TILE); } return; }
    const deep = !(N || S || Wd || E) && !land(x - 1, y - 1) && !land(x + 1, y + 1) && !land(x + 1, y - 1) && !land(x - 1, y + 1);
    const ph = Math.floor((t * 0.7 + (x + y) * 0.35) * WPH) % WPH; // 해안을 따라 위상이 이어져 파도가 흐르는 것처럼
    g.drawImage(waterFrame((N ? 1 : 0) | (S ? 2 : 0) | (Wd ? 4 : 0) | (E ? 8 : 0), deep, ((ph % WPH) + WPH) % WPH), px, py);
    if (hash(x, y, 77) < 0.12 && Math.sin(t * 3 + x * 2 + y) > 0.6) { g.fillStyle = '#fffaf0'; g.fillRect(px + 8 + ((hash(x, y, 78) * 16) | 0), py + 6 + ((hash(x, y, 79) * 16) | 0), 2, 1); } // 반짝
    return;
  }
  function groundTile(g, x, y, px, py, isNew) {
    const k = at(x, y), h = hash(x, y);
    if (k === T.G) { const arr = isNew ? NEW_GRASS : GRASS; const im = arr[(h * arr.length) | 0]; g.drawImage(im, isNew ? 1 : 0, isNew ? 1 : 0, 16, 16, px, py, TILE, TILE);
      if (isNew) { // 풀 가장자리가 모래와 닿으면 흙 자국이 모양을 따라감 (사진 1 규칙)
        const sandN = at(x, y - 1) === T.S, sandS = at(x, y + 1) === T.S, sandW = at(x - 1, y) === T.S, sandE = at(x + 1, y) === T.S;
