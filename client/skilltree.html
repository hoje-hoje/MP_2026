<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>마법석 스킬 트리 (시안)</title>
<style>
@font-face { font-family: 'Galmuri11'; src: url(assets/fonts/Galmuri11.woff2) format('woff2'); font-display: swap; }
@font-face { font-family: 'Galmuri11'; src: url(assets/fonts/Galmuri11-Bold.woff2) format('woff2'); font-weight: 700; font-display: swap; }
/* 어두운 하늘에 부채꼴 별자리 (아래 가운데 뿌리에서 위로 퍼짐) · 속성마다 형광 색 */
:root {

  --font: 'Galmuri11', system-ui, sans-serif;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: radial-gradient(ellipse at 50% 95%, #13232c 0%, var(--bg) 62%); color: var(--fg); font-family: var(--font); padding: 16px max(16px, env(safe-area-inset-right, 0px)) 16px max(16px, env(safe-area-inset-left, 0px)); overflow-x: hidden; }
.stage { position: relative; width: 100%; max-width: 1280px; margin: 0 auto; aspect-ratio: 12 / 10.6; }
.node.sealed { opacity: .25; pointer-events: none; } .node.sealed canvas { visibility: hidden; } .node.sealed::after { content: '?'; position: absolute; color: #56606a; font-weight: 700; } .brlabel.sealed { opacity: .45; text-shadow: none; }
.stage.upper { aspect-ratio: 12 / 6; } .stage.upper .low { display: none !important; }
@media (max-width: 760px) { .stage { aspect-ratio: auto; height: 560px; } }
svg.map { position: absolute; inset: 0; width: 100%; height: 100%; }
.node { position: absolute; transform: translate(-50%, -50%); width: 4.3%; aspect-ratio: 1; border-radius: 50%; border: 3px solid #4a5560; background: #10181d; padding: 0; cursor: pointer; display: grid; place-items: center; transition: transform .12s; }
.node:hover, .node:focus-visible { transform: translate(-50%, -50%) scale(1.1); outline: none; }
.node canvas { width: 72%; height: 72%; image-rendering: pixelated; filter: grayscale(1) brightness(.55); }
.node.big { width: 5.6%; }
.node.small { width: 3.6%; }
.node.open { border-color: var(--r, var(--c)); box-shadow: 0 0 0 0 var(--c); animation: pulse 1.5s ease-in-out infinite; }
.node.open canvas { filter: grayscale(.4) brightness(.9); }
.node.learned { border-color: var(--r, var(--c)); background: radial-gradient(circle at 50% 45%, color-mix(in srgb, var(--c) 38%, #10181d) 0%, #10181d 72%); box-shadow: 0 0 14px 2px color-mix(in srgb, var(--r, var(--c)) 70%, transparent), inset 0 0 0 2px color-mix(in srgb, var(--c) 30%, transparent); }
.node.learned canvas { display: none; }
.node .glyph { display: none; width: 56%; height: 56%; color: var(--c); filter: drop-shadow(0 0 3px var(--c)); }
.node.big .glyph { width: 60%; height: 60%; }
.node.learned .glyph { display: block; }
.node.sel { outline: 3px solid #fff; outline-offset: 4px; }
@keyframes pulse { 50% { box-shadow: 0 0 12px 3px var(--r, var(--c)); } }
@media (prefers-reduced-motion: reduce) { .node.open { animation: none; } }
.pill { position: absolute; left: 50%; top: 100%; transform: translate(-50%, 4px); font-size: 10px; font-weight: 700; padding: 1px 7px; border-radius: 9px; border: 2px solid #4a5560; color: var(--dim); background: var(--bg); white-space: nowrap; }
.node.learned .pill, .node.open .pill { border-color: var(--r, var(--c)); color: var(--r, var(--c)); }
.brlabel { position: absolute; transform: translate(-50%, -50%); text-align: center; font-weight: 700; letter-spacing: 1px; font-size: 14px; color: var(--c); text-shadow: 0 0 10px var(--c); pointer-events: none; white-space: nowrap; }
.brlabel small { display: block; font-size: 10px; color: var(--dim); text-shadow: none; letter-spacing: 0; font-weight: 400; }
.layout { display: grid; grid-template-columns: minmax(0, 1fr) 280px; gap: 16px; max-width: 1500px; margin: 0 auto; align-items: start; }
@media (max-width: 900px) { .layout { grid-template-columns: 1fr; } }
.info { position: sticky; top: 12px; padding: 12px 14px; background: rgba(13,23,29,.9); border-left: 3px solid var(--c, #fff); min-width: 0; }
.info h2 { margin: 0 0 2px; font-size: 16px; color: var(--c, #fff); letter-spacing: 1px; }
.info .sub { font-size: 11px; color: var(--dim); margin-bottom: 8px; }
.info canvas { width: 100%; aspect-ratio: 4 / 3; image-rendering: pixelated; border: 2px solid #26323a; background: #0b1418; display: block; }
.info p { margin: 8px 0 6px; font-size: 12px; line-height: 1.5; }
.info .kv { font-size: 11px; color: var(--dim); line-height: 1.6; }
.info button { margin-top: 8px; width: 100%; font: inherit; font-weight: 700; font-size: 13px; padding: 8px; background: var(--c, #fff); color: #061014; border: none; cursor: pointer; }
.info button:disabled { background: #2a343b; color: var(--dim); cursor: default; }
.points { position: absolute; right: 0; top: 0; text-align: right; }
.points b { display: block; font-size: 20px; line-height: 1.2; letter-spacing: 1px; }
.points span { font-size: 11px; color: var(--dim); letter-spacing: 2px; }
.points .bar { width: 120px; height: 4px; background: #26323a; margin: 6px auto 0; } .points .bar i { display: block; height: 100%; background: #c98a4a; }
.slotRow { display: flex; gap: 6px; margin-top: 6px; } .slotRow button { flex: 1; font: inherit; font-size: 12px; font-weight: 700; padding: 7px; background: #1b2a30; color: #f2d27a; border: 2px solid #f2d27a; cursor: pointer; } .slotRow button.on { background: #f2d27a; color: #061014; }
.reset { position: absolute; right: 0; bottom: 1%; font: inherit; font-size: 12px; background: none; color: var(--dim); border: 2px solid #26323a; padding: 6px 10px; cursor: pointer; }
.note { max-width: 1280px; margin: 10px auto 0; text-align: center; color: var(--dim); font-size: 12px; }
</style>
</head>
<body>
<div class="layout"><div class="stage" id="stage"><svg class="map" id="map" viewBox="0 0 1200 1060" preserveAspectRatio="none" aria-hidden="true"></svg>
  <div class="points"><b id="pts"></b><span id="ptsLbl">내 마법석</span></div>
  <button class="reset" id="reset" type="button">다시 찍기</button>
</div><div class="info" id="info"></div></div>
<p class="note">시안 화면 · 처음엔 위의 기본 6속성만 보여요. 숨은 속성이 하나라도 열리면 아래쪽이 나타나고, 아직 못 연 숨은 속성은 ???로 보여요.</p>
<script src="rules.js"></script>
<script src="texts.js"></script>
<script type="module">

  if (n.tier === 'a' || n.tier === 'b') { const o = n.el.id + '.' + (n.tier === 'a' ? 'b' : 'a'); if (L(o)) return 'locked'; }

    dark: '<path fill="currentColor" d="M15 3a9 9 0 1 0 6 15A8 8 0 0 1 15 3z"/>', chrono: '<path fill="currentColor" d="M6 2h12v2l-5 8 5 8v2H6v-2l5-8-5-8z"/>', root: '<path fill="currentColor" d="M12 2 20 12 12 22 4 12z"/><path fill="#10181d" d="M12 7 16 12 12 17 8 12z"/><circle cx="12" cy="12" r="1.6" fill="currentColor"/>' };
  const extra = tier === 'ult' ? '<circle cx="12" cy="12" r="11" fill="none" stroke="currentColor" stroke-width="1" opacity=".55"/>' : (tier === 'a' || tier === 'b') ? '<circle cx="20.5" cy="3.5" r="2" fill="currentColor"/>' : '';
  return `<svg class="glyph" viewBox="0 0 24 24" aria-hidden="true">${G[el] || G.root}${extra}</svg>`; }
const labels = [];
BASE.forEach((e, i) => labels.push([e, pt(UA[i], 498)]));
HIDDEN.forEach((e, i) => labels.push([e, pt(DA[i], 478)]));
for (const [e, [x, y]] of labels) { const d = document.createElement('div'); d.className = 'brlabel'; d.dataset.el = e.id; d.style.setProperty('--c', e.hex); d.style.left = (x / 12) + '%'; d.style.top = 'calc(' + y + ' / var(--vh, 10.6) * 1%)'; if (e.req) d.classList.add('low'); d.style.setProperty('--c', e.ring || e.hex); stage.append(d); }
function drawMap() { let h = '';
  for (const r of [150, 285, 420]) h += `<path d="M${CX - r} ${CY} A${r} ${r} 0 0 1 ${CX + r} ${CY}" fill="none" stroke="#1c2a32" stroke-width="2"/>`;
  const anyLow = HIDDEN.some(hiddenOpen);
  if (anyLow) for (const r of [170, 290, 400]) h += `<path d="M${CX - r} ${CY} A${r} ${r} 0 0 0 ${CX + r} ${CY}" fill="none" stroke="#1a1c30" stroke-width="2" stroke-dasharray="3 7"/>`;

  for (const k of Object.keys(N)) { const n = N[k]; if (n.tier === 't1' && n.el.req) { const a = N.root.pos, b = n.pos, on = hiddenOpen(n.el); if (!on) continue; h += `<line x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}" stroke="${on ? n.hex : '#2a2f45'}" stroke-width="${on ? 3 : 2}" stroke-dasharray="6 6" opacity="${on ? 0.9 : 1}"/>`; continue; }

  { const e = N[sel].el || BASE[1]; document.getElementById('pts').innerHTML = ['Ⅰ', 'Ⅱ', 'Ⅲ'].map((r) => `<span style="color:${e.hex}">${r}</span>×${INV[e.id + '.' + r] | 0}`).join('  '); document.getElementById('ptsLbl').textContent = `내 ${e.name} 마법석`; }
