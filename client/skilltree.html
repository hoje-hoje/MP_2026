<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>마법석 스킬 트리 (시안)</title>
<style>
@font-face { font-family: 'Galmuri11'; src: url(assets/fonts/Galmuri11.woff2) format('woff2'); font-display: swap; }
@font-face { font-family: 'Galmuri11'; src: url(assets/fonts/Galmuri11-Bold.woff2) format('woff2'); font-weight: 700; font-display: swap; }
/* 어두운 하늘에 부채꼴 별자리 (아래 가운데 뿌리에서 위로 퍼짐) · 속성마다 형광 색 */
:root {
  --bg: #060c10; --bg2: #0d171d; --line: #3a4650; --dim: #7d8a94; --fg: #eef4f6;
  --fire: #ff3b4a; --ice: #3fd6ff; --bolt: #ffd23d; --holy: #fff3b0; --nature: #2ef07a; --star: #b57bff;
  --font: 'Galmuri11', system-ui, sans-serif;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: radial-gradient(ellipse at 50% 95%, #13232c 0%, var(--bg) 62%); color: var(--fg); font-family: var(--font); padding: 16px max(16px, env(safe-area-inset-right, 0px)) 16px max(16px, env(safe-area-inset-left, 0px)); overflow-x: hidden; }
.stage { position: relative; width: 100%; max-width: 1280px; margin: 0 auto; aspect-ratio: 12 / 7; }
@media (max-width: 760px) { .stage { aspect-ratio: auto; height: 560px; } }
svg.map { position: absolute; inset: 0; width: 100%; height: 100%; }
.node { position: absolute; transform: translate(-50%, -50%); width: 4.3%; aspect-ratio: 1; border-radius: 50%; border: 3px solid #4a5560; background: #10181d; padding: 0; cursor: pointer; display: grid; place-items: center; transition: transform .12s; }
.node:hover, .node:focus-visible { transform: translate(-50%, -50%) scale(1.1); outline: none; }
.node canvas { width: 72%; height: 72%; image-rendering: pixelated; filter: grayscale(1) brightness(.55); }
.node.big { width: 5.6%; }
.node.small { width: 3.6%; }
.node.open { border-color: var(--c); box-shadow: 0 0 0 0 var(--c); animation: pulse 1.5s ease-in-out infinite; }
.node.open canvas { filter: grayscale(.4) brightness(.9); }
.node.learned { border-color: var(--c); background: var(--c); box-shadow: 0 0 14px 2px var(--c); }
.node.learned canvas { filter: none; }
.node.sel { outline: 3px solid #fff; outline-offset: 4px; }
@keyframes pulse { 50% { box-shadow: 0 0 12px 3px var(--c); } }
@media (prefers-reduced-motion: reduce) { .node.open { animation: none; } }
.pill { position: absolute; left: 50%; top: 100%; transform: translate(-50%, 4px); font-size: 10px; font-weight: 700; padding: 1px 7px; border-radius: 9px; border: 2px solid #4a5560; color: var(--dim); background: var(--bg); white-space: nowrap; }
.node.learned .pill, .node.open .pill { border-color: var(--c); color: var(--c); }
.brlabel { position: absolute; transform: translate(-50%, -50%); text-align: center; font-weight: 700; letter-spacing: 1px; font-size: 14px; color: var(--c); text-shadow: 0 0 10px var(--c); pointer-events: none; white-space: nowrap; }
.brlabel small { display: block; font-size: 10px; color: var(--dim); text-shadow: none; letter-spacing: 0; font-weight: 400; }
.info { position: absolute; left: 0; top: 0; width: min(300px, 40%); padding: 12px 14px; background: linear-gradient(90deg, rgba(6,12,16,.92), rgba(6,12,16,.55)); border-left: 3px solid var(--c, #fff); }
.info h2 { margin: 0 0 2px; font-size: 16px; color: var(--c, #fff); letter-spacing: 1px; }
.info .sub { font-size: 11px; color: var(--dim); margin-bottom: 8px; }
.info canvas { width: 100%; aspect-ratio: 4 / 3; image-rendering: pixelated; border: 2px solid #26323a; background: #0b1418; display: block; }
.info p { margin: 8px 0 6px; font-size: 12px; line-height: 1.5; }
.info .kv { font-size: 11px; color: var(--dim); line-height: 1.6; }
.info button { margin-top: 8px; width: 100%; font: inherit; font-weight: 700; font-size: 13px; padding: 8px; background: var(--c, #fff); color: #061014; border: none; cursor: pointer; }
.info button:disabled { background: #2a343b; color: var(--dim); cursor: default; }
.points { position: absolute; left: 57.5%; bottom: 0; transform: translateX(-50%); text-align: center; }
.points b { display: block; font-size: 30px; line-height: 1; }
.points span { font-size: 11px; color: var(--dim); letter-spacing: 2px; }
.points .bar { width: 120px; height: 4px; background: #26323a; margin: 6px auto 0; } .points .bar i { display: block; height: 100%; background: #c98a4a; }
.reset { position: absolute; right: 0; bottom: 1%; font: inherit; font-size: 12px; background: none; color: var(--dim); border: 2px solid #26323a; padding: 6px 10px; cursor: pointer; }
.note { max-width: 1280px; margin: 10px auto 0; text-align: center; color: var(--dim); font-size: 12px; }
</style>
</head>
<body>
<div class="stage" id="stage"><svg class="map" id="map" viewBox="0 0 1200 700" preserveAspectRatio="none" aria-hidden="true"></svg>
  <div class="info" id="info"></div>
  <div class="points"><b id="pts">3</b><span>마법석</span><div class="bar"><i id="ptsBar" style="width:40%"></i></div></div>
  <button class="reset" id="reset" type="button">다시 찍기</button>
</div>
<p class="note">시안 화면 · 동그라미를 누르면 왼쪽 위에서 마법이 실제로 터져요. 2단계는 둘 중 하나만 · 궁극기는 2단계 하나만 배워도 열려요 · 1단계는 3번까지 올릴 수 있어요.</p>
<script type="module">
const P = '/assets/pixelfx/';
const core = await import(P + 'core/index.js');
const cache = {}; const load = async (k) => (cache[k] = cache[k] || await import(P + 'fx/' + k + '.js'));
// 왼쪽 → 오른쪽 순서 (이웃한 속성끼리 합체 마법)
const EL = [
  { id: 'nature', name: '자연', en: '대지·식물', c: 'var(--nature)', hex: '#2ef07a', n: [['t1', '꽃 피우기', 'nature/healing-bloom', '작물이 빨리 자라요'], ['a', '덩굴 묶기', 'nature/root-snare', '덩굴로 발을 묶어요'], ['b', '바위 굴리기', 'nature/boulder', '큰 바위를 굴려요'], ['ult', '지진', 'nature/quake', '땅이 크게 흔들려요']] },
  { id: 'fire', name: '불', en: '불꽃', c: 'var(--fire)', hex: '#ff3b4a', n: [['t1', '불씨', 'fire/torch', '손끝에 불을 켜요 · 밤에 주변이 밝아져요'], ['a', '파이어볼', 'fire/fireball', '불덩이를 날려요'], ['b', '화염 고리', 'fire/fire-ring', '내 둘레를 불꽃이 감싸요'], ['ult', '메테오', 'fire/meteor', '하늘에서 운석이 떨어져요']] },
  { id: 'bolt', name: '번개', en: '전기', c: 'var(--bolt)', hex: '#ffd23d', n: [['t1', '정전기', 'lightning/spark-arc', '찌릿! · 잠깐 빨라져요'], ['a', '연쇄 번개', 'lightning/chain-lightning', '번개가 여러 명에게 튀어요'], ['b', '번개 공', 'lightning/ball-lightning', '떠다니는 번개 공'], ['ult', '번개구름', 'lightning/storm-cloud', '먹구름에서 번개가 쏟아져요']] },
  { id: 'star', name: '시공', en: '별·시간·공간', c: 'var(--star)', hex: '#b57bff', n: [['t1', '마법진', 'arcane/magic-circle-cast', '수학 마법진 · 다음 마법이 강해져요'], ['a', '순간이동', 'arcane/blink-in', '앞으로 휙 이동해요'], ['b', '별똥별', 'arcane/star-fall', '별이 쏟아져요'], ['ult', '시간 정지', 'arcane/time-stop', '잠깐 시간이 멈춰요']] },
  { id: 'holy', name: '빛', en: '신성', c: 'var(--holy)', hex: '#fff3b0', n: [['t1', '회복', 'holy/heal', '나를 치료해요'], ['a', '보호막', 'holy/divine-shield', '잠깐 아무것도 못 맞아요'], ['b', '광역 회복', 'holy/heal-aoe', '주변 모두를 치료해요'], ['ult', '부활', 'holy/resurrection', '쓰러진 친구를 일으켜요']] },
  { id: 'ice', name: '얼음', en: '냉기', c: 'var(--ice)', hex: '#3fd6ff', n: [['t1', '서리', 'ice/snowflake-burst', '물 위를 잠깐 얼려 건너요'], ['a', '얼음창', 'ice/ice-lance', '얼음 창을 날려요'], ['b', '얼음 가시', 'ice/ice-spikes', '땅에서 얼음 가시가 솟아요'], ['ult', '눈보라', 'ice/blizzard-vortex', '큰 눈보라가 몰아쳐요']] },
];
const COMBO = [
  { key: 'c1', name: '불꽃 회오리', fx: 'fire/fire-tornado', between: [0, 1], need: ['nature.b', 'fire.a'], hex: '#ff8a3d', desc: '자연 + 불 · 합체 마법' },
  { key: 'c2', name: '플라즈마', fx: 'lightning/plasma-ball', between: [2, 3], need: ['bolt.b', 'star.a'], hex: '#e08bff', desc: '번개 + 시공 · 합체 마법' },
  { key: 'c3', name: '성스러운 얼음', fx: 'ice/ice-crystal', between: [4, 5], need: ['holy.b', 'ice.a'], hex: '#9fe8ff', desc: '빛 + 얼음 · 합체 마법' },
];
const MAX = { t1: 3, a: 1, b: 1, ult: 1 }, COST = { t1: 1, a: 2, b: 2, ult: 4 }, CD = { t1: '5초', a: '8초', b: '10초', ult: '60초' };
const CX = 690, CY = 590, ANG = EL.map((_, i) => 162 - i * (144 / (EL.length - 1))), RAD = { t1: 150, ab: 285, ult: 420, combo: 360 };
const pt = (deg, r) => [CX + r * Math.cos(deg * Math.PI / 180), CY - r * Math.sin(deg * Math.PI / 180)];
const N = { root: { key: 'root', name: '마력 깨우기', fx: 'arcane/mana-burst', hex: '#ffffff', desc: '모두 처음부터 배워요. 작은 빛을 켤 수 있어요.', max: 1, cost: 0, pos: [CX, CY], big: true } };
EL.forEach((e, i) => { const a = ANG[i]; for (const [k, name, fx, desc] of e.n) { const pos = k === 't1' ? pt(a, RAD.t1) : k === 'a' ? pt(a + 6, RAD.ab) : k === 'b' ? pt(a - 6, RAD.ab) : pt(a, RAD.ult);
  N[e.id + '.' + k] = { key: e.id + '.' + k, el: e, tier: k, name, fx, desc, hex: e.hex, max: MAX[k], cost: COST[k], pos, big: k === 'ult' }; } });
for (const c of COMBO) N[c.key] = Object.assign({ max: 1, cost: 3, pos: pt((ANG[c.between[0]] + ANG[c.between[1]]) / 2, RAD.combo), small: true }, c);
let lv = { root: 1, 'fire.t1': 3, 'fire.a': 1, 'holy.t1': 1 }, stones = 3, sel = 'fire.ult';
const L = (k) => lv[k] | 0;
function pre(k) { const n = N[k]; if (k === 'root') return []; if (n.need) return n.need; if (n.tier === 't1') return ['root']; if (n.tier === 'ult') return [n.el.id + '.a', n.el.id + '.b']; return [n.el.id + '.t1']; }
function state(k) { const n = N[k]; if (L(k) >= n.max) return 'learned';
  if (n.tier === 'a' || n.tier === 'b') { const o = n.el.id + '.' + (n.tier === 'a' ? 'b' : 'a'); if (L(o)) return 'locked'; }
  const ok = n.tier === 'ult' ? pre(k).some((p) => L(p)) : pre(k).every((p) => L(p)); return ok ? (L(k) ? 'learned-part' : 'open') : 'locked'; }
const stage = document.getElementById('stage'), map = document.getElementById('map');
// 노드 만들기
for (const k of Object.keys(N)) { const n = N[k], b = document.createElement('button'); b.type = 'button'; b.className = 'node' + (n.big ? ' big' : '') + (n.small ? ' small' : ''); b.dataset.k = k; b.style.setProperty('--c', n.hex); b.style.left = (n.pos[0] / 12) + '%'; b.style.top = (n.pos[1] / 7) + '%'; b.setAttribute('aria-label', n.name);
  b.innerHTML = `<canvas width="48" height="48" data-ico="${k}"></canvas><span class="pill"></span>`; b.onclick = () => { sel = k; render(); }; stage.append(b); }
EL.forEach((e, i) => { const [x, y] = pt(ANG[i], RAD.ult + 78); const d = document.createElement('div'); d.className = 'brlabel'; d.style.setProperty('--c', e.hex); d.style.left = (x / 12) + '%'; d.style.top = (y / 7) + '%'; d.innerHTML = `${e.name}<small>${e.en}</small>`; stage.append(d); });
function drawMap() { let h = '';
  for (const r of [RAD.t1, RAD.ab, RAD.ult]) h += `<path d="M${CX - r} ${CY} A${r} ${r} 0 0 1 ${CX + r} ${CY}" fill="none" stroke="#1c2a32" stroke-width="2"/>`; // 둥근 길
  for (let a = 14; a <= 166; a += 4) { const [x1, y1] = pt(a, RAD.ult + 40), [x2, y2] = pt(a, RAD.ult + 48); h += `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="#1c2a32" stroke-width="2"/>`; }
  for (const k of Object.keys(N)) for (const p of pre(k)) { const a = N[p].pos, b = N[k].pos, on = L(k) && L(p), col = N[k].hex;
    h += on ? `<line x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}" stroke="${col}" stroke-width="7" opacity=".25"/><line x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}" stroke="${col}" stroke-width="3"/>` : `<line x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}" stroke="#3a4650" stroke-width="2" ${N[k].need ? 'stroke-dasharray="5 6"' : ''}/>`; }
  map.innerHTML = h; }
async function icons() { for (const c of stage.querySelectorAll('canvas[data-ico]')) { const n = N[c.dataset.ico], mod = await load(n.fx), m = mod.meta || {}, sz = m.size || [64, 64], o = m.origin || [sz[0] / 2, sz[1] / 2];
  const fr = core.createFrame(sz[0], sz[1]), f = core.createFx(mod, { x: o[0], y: o[1] }); f.update(Math.min(0.7, (m.duration || 1) * 0.5)); f.draw(fr);
  const im = new ImageData(sz[0], sz[1]); core.composite(fr, im.data, null); const t = document.createElement('canvas'); t.width = sz[0]; t.height = sz[1]; t.getContext('2d').putImageData(im, 0, 0);
  const g = c.getContext('2d'), k = Math.min(48 / sz[0], 48 / sz[1]) * 1.5; g.imageSmoothingEnabled = false; g.drawImage(t, 24 - sz[0] * k / 2, 24 - sz[1] * k / 2, sz[0] * k, sz[1] * k); } }
let pvId = 0;
async function preview(n) { const id = ++pvId, mod = await load(n.fx); if (id !== pvId) return; const cv = document.getElementById('pv'); if (!cv) return; const g = cv.getContext('2d'), m = mod.meta || {}, sz = m.size || [80, 80], o = m.origin || [sz[0] / 2, sz[1] / 2];
  const W = 160, H = 120, fr = core.createFrame(W, H), im = new ImageData(W, H), t2 = document.createElement('canvas'); t2.width = W; t2.height = H; let f, t = 0, last = performance.now();
  const spawn = () => { f = core.createFx(mod, { x: W / 2 - (sz[0] / 2 - o[0]), y: H / 2 + 6 - (sz[1] / 2 - o[1]) }); t = 0; }; spawn();
  (function step(now) { if (id !== pvId) return; const dt = Math.min(0.05, (now - last) / 1000); last = now; t += dt; if (t > (m.duration || 1) + 0.5) spawn();
    core.clearFrame(fr); f.update(dt); f.draw(fr); core.composite(fr, im.data, null); t2.getContext('2d').putImageData(im, 0, 0);
    g.fillStyle = '#0b1418'; g.fillRect(0, 0, W, H); g.fillStyle = '#16242b'; for (let y = 4; y < H; y += 10) for (let x = (y / 10) % 2 ? 9 : 4; x < W; x += 10) g.fillRect(x, y, 1, 1); g.drawImage(t2, 0, 0); requestAnimationFrame(step); })(last); }
function info() { const n = N[sel], st = state(sel), box = document.getElementById('info'); box.style.setProperty('--c', n.hex);
  const tierName = { t1: '1단계', a: '2단계', b: '2단계', ult: '궁극기' }[n.tier] || (n.need ? '합체 마법' : '시작');
  const can = (st === 'open' || st === 'learned-part') && stones >= n.cost;
  box.innerHTML = `<h2>${n.name}</h2><div class="sub">${n.el ? n.el.name + ' 마법 · ' : ''}${tierName} · ${L(sel)}/${n.max}</div><canvas id="pv" width="160" height="120"></canvas><p>${n.desc}</p>
    <div class="kv">필요: ${pre(sel).length ? pre(sel).map((p) => N[p].name).join(n.tier === 'ult' ? ' 또는 ' : ' + ') : '없음'}<br>마법석: ${n.cost ? n.cost + '개' + (n.max > 1 ? ' (한 번 올릴 때마다)' : '') : '무료'} · 쿨타임 ${CD[n.tier] || '20초'}</div>
    <button id="learn" type="button" ${can ? '' : 'disabled'}>${st === 'learned' ? '다 배웠어요' : st === 'locked' ? ((n.tier === 'a' || n.tier === 'b') && L(n.el.id + '.' + (n.tier === 'a' ? 'b' : 'a')) ? '다른 쪽을 골랐어요' : '앞 마법을 먼저 배워요') : stones < n.cost ? '마법석이 모자라요' : `마법석 ${n.cost}개로 ${L(sel) ? '강화' : '배우기'}`}</button>`;
  document.getElementById('learn').onclick = () => { if (!can) return; lv[sel] = L(sel) + 1; stones -= n.cost; render(); }; preview(n); }
function render() { for (const b of stage.querySelectorAll('.node')) { const k = b.dataset.k, st = state(k), n = N[k]; b.classList.toggle('learned', L(k) > 0); b.classList.toggle('open', st === 'open' || st === 'learned-part'); b.classList.toggle('sel', k === sel); b.querySelector('.pill').textContent = `${L(k)}/${n.max}`; }
  document.getElementById('pts').textContent = stones; document.getElementById('ptsBar').style.width = Math.min(100, stones / 10 * 100) + '%'; drawMap(); info(); }
document.getElementById('reset').onclick = () => { lv = { root: 1 }; stones = 10; render(); };
render(); icons();
</script>
</body>
</html>
