<meta charset="utf-8">
<title>MP 2026 세계</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
@font-face { font-family: 'Galmuri11'; src: url(assets/fonts/Galmuri11.woff2) format('woff2'); font-display: swap; }
@font-face { font-family: 'Galmuri11'; src: url(assets/fonts/Galmuri11-Bold.woff2) format('woff2'); font-weight: 700; font-display: swap; }
/* 한 화면 게임: 캔버스가 화면 전체, HUD는 네 모서리에 떠 있는 두꺼운 테두리 카드. 단일 테마(밝은 게임 UI). */
:root {
  --ink: #2b2340;
  --paper: #fffdf8;
  --muted: #5f5877;
  --danger: #c22f53;
  --danger-fill: #e5486a;
  --void: #1b1430;
  --grass: #9fd88a;
  --font-display: 'Galmuri11', 'Jua', 'Noto Sans KR', system-ui, sans-serif;
  --font-body: 'Galmuri11', 'Noto Sans KR', system-ui, -apple-system, 'Apple SD Gothic Neo', sans-serif;
  color-scheme: light;
}
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; background: var(--void); color: var(--ink); font-family: var(--font-body); overflow: hidden; touch-action: none; -webkit-user-select: none; user-select: none; }
#game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
.card { background: #fdf6ec; background-clip: padding-box; border: 12px solid transparent; border-image: url(assets/na/panel.png) 6 / 15px stretch; border-radius: 0; box-shadow: none; image-rendering: pixelated; }
.hud { position: fixed; z-index: 5; }
#where { left: max(12px, env(safe-area-inset-left, 0px)); top: calc(12px + env(safe-area-inset-top, 0px)); padding: 10px 14px; min-width: 210px; max-width: min(320px, calc(100vw - 32px)); display: flex; flex-direction: column; gap: 6px; }
#where .name { font-family: var(--font-display); font-size: 22px; line-height: 1.1; }
#where .sub { font-size: 12px; font-weight: 700; color: var(--muted); }
.chips { display: flex; flex-wrap: wrap; gap: 4px; }
.chip { border-radius: 0; box-shadow: inset 0 0 0 1px rgba(0,0,0,0.25); padding: 0 9px; font-size: 11px; font-weight: 700; line-height: 20px; color: #ffffff; background: var(--ink); }
.chip.line { background: var(--paper); color: var(--ink); border: 2px solid var(--ink); line-height: 16px; }
#doom { left: 50%; transform: translateX(-50%); top: calc(12px + env(safe-area-inset-top, 0px)); width: min(360px, 40vw); padding: 6px 14px 8px; display: flex; flex-direction: column; gap: 4px; }
#doom .row { display: flex; justify-content: space-between; align-items: baseline; font-size: 12px; font-weight: 700; color: var(--muted); }
#doom .d { font-family: var(--font-display); font-size: 26px; line-height: 26px; color: var(--danger); }
.bar { height: 14px; background: #3b2f4f; border: 2px solid var(--ink); border-radius: 0; overflow: hidden; box-shadow: inset 0 2px 0 rgba(0,0,0,0.35); }
.bar > div { height: 100%; width: 62%; background: repeating-linear-gradient(90deg, var(--danger-fill) 0 6px, #f06b88 6px 8px); box-shadow: inset 0 -3px 0 rgba(0,0,0,0.2), inset 0 2px 0 rgba(255,255,255,0.35); }
#tools { right: max(12px, env(safe-area-inset-right, 0px)); top: calc(12px + env(safe-area-inset-top, 0px)); display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; max-width: 46vw; }
button { font-family: var(--font-display); font-size: 16px; color: #ffffff; text-shadow: 0 2px 0 rgba(43,35,64,0.55); background: transparent; border: 9px solid transparent; border-image: url(assets/na/btn.png) 3 fill / 9px stretch; border-radius: 0; box-shadow: none; min-height: 44px; padding: 0 8px; cursor: pointer; image-rendering: pixelated; }
button:hover { border-image-source: url(assets/na/btn_hover.png); }
button:active { border-image-source: url(assets/na/btn_pressed.png); transform: translateY(1px); }
.sw, .facebtn, .charbtn { border-image: none; text-shadow: none; }
button:focus-visible { outline: 3px solid var(--danger-fill); outline-offset: 2px; }
#mini { right: max(12px, env(safe-area-inset-right, 0px)); bottom: calc(12px + env(safe-area-inset-bottom, 0px)); padding: 6px; }
#mini canvas { display: block; width: 168px; height: 168px; border-radius: 10px; cursor: crosshair; }
#mini .cap { font-size: 11px; font-weight: 700; color: var(--muted); text-align: center; margin-top: 4px; }
#help { left: max(12px, env(safe-area-inset-left, 0px)); bottom: calc(12px + env(safe-area-inset-bottom, 0px)); padding: 8px 12px; font-size: 12px; font-weight: 700; max-width: min(420px, calc(100vw - 230px)); }
#prompt { left: 50%; transform: translateX(-50%); bottom: calc(24px + env(safe-area-inset-bottom, 0px)); padding: 8px 16px; font-size: 14px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
#prompt kbd { font-family: var(--font-display); background: var(--ink); color: #ffffff; border-radius: 0; padding: 0 7px; box-shadow: 0 2px 0 #000; }
#toast { left: 50%; transform: translateX(-50%); top: 96px; background: #2b2340; color: #fff6d6; padding: 8px 16px; border: 3px solid #fff6d6; outline: 3px solid #2b2340; border-radius: 0; font-size: 13px; font-weight: 700; }
#bigmap { position: fixed; inset: 0; z-index: 20; background: rgba(27, 20, 48, 0.82); display: flex; align-items: center; justify-content: center; padding: 16px; }
#bigmap .panel { padding: 12px; display: flex; flex-direction: column; gap: 8px; max-width: 100%; }
#bigmap .head { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
#bigmap h2 { margin: 0; font-family: var(--font-display); font-weight: 400; font-size: 22px; }
#bigmap canvas { width: min(78vmin, 720px); height: min(78vmin, 720px); max-width: 100%; border-radius: 12px; cursor: crosshair; display: block; }
#bigmap .legend { display: flex; flex-wrap: wrap; gap: 6px; font-size: 12px; font-weight: 700; }
#inv { right: max(12px, env(safe-area-inset-right, 0px)); top: calc(70px + env(safe-area-inset-top, 0px)); padding: 6px 12px; display: flex; gap: 12px; font-size: 13px; font-weight: 700; font-variant-numeric: tabular-nums; }
#inv b { color: var(--muted); font-weight: 700; margin-right: 2px; }
.invc { display: inline-flex; align-items: center; gap: 4px; }
.invc img { image-rendering: pixelated; }
#skyTimer { left: 50%; transform: translateX(-50%); top: calc(84px + env(safe-area-inset-top, 0px)); padding: 4px 14px; font-size: 13px; font-weight: 700; }
#skyTimer b { font-family: var(--font-display); font-size: 18px; font-weight: 400; font-variant-numeric: tabular-nums; }
#skyTimer.warn { background: #ffe1e8; }
#coupon { position: fixed; z-index: 20; inset: 0; background: rgba(27, 20, 48, 0.6); display: flex; align-items: center; justify-content: center; padding: 16px; }
#coupon .panel { padding: 16px 18px; display: flex; flex-direction: column; gap: 10px; width: min(380px, 100%); }
#coupon h2 { margin: 0; font-family: var(--font-display); font-weight: 400; font-size: 24px; }
#coupon label { font-size: 13px; font-weight: 700; display: block; margin-bottom: 6px; }
#coupon input { width: 100%; box-sizing: border-box; font: 700 20px var(--font-display); letter-spacing: 2px; text-transform: uppercase; color: var(--ink); background: #ffffff; border: 3px solid var(--ink); border-radius: 10px; padding: 8px 10px; }
#coupon .msg { margin: 0; font-size: 13px; font-weight: 700; color: var(--muted); min-height: 2.6em; }
#chat { left: max(12px, env(safe-area-inset-left, 0px)); bottom: calc(12px + env(safe-area-inset-bottom, 0px)); width: min(380px, calc(100vw - 220px)); padding: 8px 10px; display: flex; flex-direction: column; gap: 6px; }
.chathead { font-size: 11px; font-weight: 700; color: var(--muted); }
.chatlog { max-height: 150px; overflow-y: auto; font-size: 13px; line-height: 1.45; display: flex; flex-direction: column; gap: 2px; overflow-wrap: anywhere; }
.chatlog b { color: var(--ink); }
.chatrow { display: flex; gap: 6px; }
.chatrow input { flex: 1; min-width: 0; font: 500 14px var(--font-body); color: var(--ink); background: #ffffff; border: 2px solid var(--ink); border-radius: 10px; padding: 6px 8px; }
.chatrow button { min-height: 36px; font-size: 14px; padding: 0 10px; }
#join, #wanderBox { position: fixed; z-index: 25; inset: 0; background: rgba(27, 20, 48, 0.6); display: flex; align-items: center; justify-content: center; padding: 16px; }
#join .panel, #wanderBox .panel { padding: 16px 18px; display: flex; flex-direction: column; gap: 10px; width: min(400px, 100%); }
#join h2, #wanderBox h2 { margin: 0; font-family: var(--font-display); font-weight: 400; font-size: 24px; }
#join label, #wanderBox label { font-size: 13px; font-weight: 700; display: block; margin-bottom: 6px; }
#join input, #wanderBox input { width: 100%; box-sizing: border-box; font: 700 16px var(--font-body); color: var(--ink); background: #ffffff; border: 3px solid var(--ink); border-radius: 10px; padding: 8px 10px; }
#wanderBox .msg { margin: 0; font-size: 13px; font-weight: 700; color: var(--muted); }
.seg.wrap { flex-wrap: wrap; }
.wlist { max-height: 140px; overflow-y: auto; font-size: 13px; display: flex; flex-direction: column; gap: 2px; }
#war { position: fixed; z-index: 22; inset: 0; background: rgba(27, 20, 48, 0.6); display: flex; align-items: center; justify-content: center; padding: 16px; }
#war .panel { padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; width: min(560px, 100%); max-height: calc(100vh - 32px); }
#war .head { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
#war h2 { margin: 0; font-family: var(--font-display); font-weight: 400; font-size: 22px; }
#war h3 { margin: 8px 0 4px; font-size: 13px; }
.warhead { font-size: 13px; line-height: 1.6; }
.warhead span { color: var(--muted); font-size: 12px; }
.warbody { overflow-y: auto; min-height: 120px; display: flex; flex-direction: column; gap: 6px; padding-right: 4px; }
.warbody .msg, .warbody .note { margin: 0; font-size: 12px; color: var(--muted); line-height: 1.5; }
.warbody .note { color: #8a4fc0; }
.warbody .row { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 13px; flex-wrap: wrap; }
.warbody .row button, .warbody .tgt { min-height: 36px; font-size: 13px; }
.targets { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 6px; }
.tgt { display: flex; flex-direction: column; align-items: flex-start; text-align: left; padding: 4px 8px; color: #2b2340; text-shadow: none; border-image: none !important; border: 2px solid #2b2340 !important; background: #fffdf8 !important; }
.tgt small { color: var(--muted); font-size: 11px; }
.tgt[aria-pressed="true"] { background: #ffe9a8 !important; }
.plan, .report { border: 2px solid #2b2340; background: #fff8ea; padding: 8px 10px; display: flex; flex-direction: column; gap: 6px; }
.report.won { background: #eaf8e8; } .report.lost { background: #fbeaea; }
.fronts { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
.front { display: flex; flex-direction: column; gap: 2px; font-size: 12px; font-weight: 700; }
.front input { width: 100%; box-sizing: border-box; font: 700 18px var(--font-display); color: var(--ink); background: #ffffff; border: 3px solid var(--ink); padding: 4px 6px; text-align: center; }
.report table { border-collapse: collapse; font-size: 12px; font-variant-numeric: tabular-nums; }
.report td, .report th { border: 1px solid #c9b79a; padding: 2px 8px; text-align: center; }
.report td.w { background: #ffe08a; font-weight: 700; }
.row.test { border-top: 2px dashed #c9b79a; padding-top: 8px; margin-top: 4px; }
#closet { position: fixed; z-index: 20; inset: 0; background: rgba(27, 20, 48, 0.6); display: flex; align-items: center; justify-content: center; padding: 16px; }
#closet .panel { padding: 16px 18px; display: flex; flex-direction: column; gap: 12px; width: min(380px, 100%); }
#closet h2 { margin: 0; font-family: var(--font-display); font-weight: 400; font-size: 24px; }
#closet label { font-size: 13px; font-weight: 700; display: block; margin-bottom: 6px; }
#closet input[type=text] { width: 100%; box-sizing: border-box; font: 700 16px var(--font-body); color: var(--ink); background: #ffffff; border: 3px solid var(--ink); border-radius: 10px; padding: 8px 10px; }
.swatches { display: flex; gap: 8px; flex-wrap: wrap; }
.sw { width: 40px; height: 40px; min-height: 40px; padding: 0; border: 3px solid var(--ink); border-radius: 999px; box-shadow: none; }
.facegrid { max-height: 210px; overflow-y: auto; display: grid !important; grid-template-columns: repeat(auto-fill, minmax(46px, 1fr)); gap: 4px; }
.facebtn { width: 46px; height: 46px; min-height: 0; padding: 2px; border: 2px solid #d9c8b0; border-radius: 6px; background: #2b2340; }
.facebtn canvas { width: 38px; height: 38px; image-rendering: pixelated; display: block; }
.facebtn[aria-pressed="true"] { border-color: #ffd23f; box-shadow: 0 0 0 2px #2b2340; }
.charbtn { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 8px; min-height: 0; font-size: 13px; box-shadow: none; }
.charbtn canvas { image-rendering: pixelated; }
.charbtn[aria-pressed="true"] { background: var(--ink); color: #ffffff; }
.sw[aria-pressed="true"] { box-shadow: 0 0 0 3px var(--paper), 0 0 0 6px var(--ink); }
.seg { display: flex; gap: 8px; }
.seg button[aria-pressed="true"] { background: var(--ink); color: #ffffff; }
#loading { position: fixed; inset: 0; z-index: 30; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; background: linear-gradient(180deg, #a9dcff 0%, #fdf3ff 70%, #f6d9e8 100%); color: #2b2340; font-family: var(--font-display); font-size: 22px; text-align: center; padding: 16px; image-rendering: pixelated; }
#loading .logo { font-size: 66px; line-height: 1; letter-spacing: 4px; color: #ffffff; text-shadow: 4px 0 0 #2b2340, -4px 0 0 #2b2340, 0 4px 0 #2b2340, 0 -4px 0 #2b2340, 4px 4px 0 #2b2340, -4px 4px 0 #2b2340, 4px -4px 0 #2b2340, -4px -4px 0 #2b2340, 0 10px 0 #c22f53; }
#loading .tag { font-size: 22px; color: #6b4fb3; }
#loading small { font-family: var(--font-body); font-size: 11px; color: #5f5877; }
#loading .dots { width: 160px; height: 14px; border: 3px solid #2b2340; background: #fffdf8; position: relative; overflow: hidden; }
#loading .dots::after { content: ""; position: absolute; inset: 0; width: 40%; background: repeating-linear-gradient(90deg, #6b4fb3 0 8px, #8a6fd0 8px 12px); animation: load 1.2s steps(10) infinite; }
@keyframes load { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
@media (prefers-reduced-motion: reduce) { #loading .dots::after { animation: none; } }
#stick { position: fixed; z-index: 6; width: 110px; height: 110px; border-radius: 0; image-rendering: pixelated; border: 3px solid rgba(255,255,255,0.8); background: rgba(43,35,64,0.25); pointer-events: none; }
#stick div { position: absolute; left: 50%; top: 50%; width: 46px; height: 46px; margin: -23px 0 0 -23px; border-radius: 999px; background: rgba(255,255,255,0.9); border: 3px solid var(--ink); }
@media (max-width: 720px) {
  #doom { display: none; }
  #skyTimer { top: calc(120px + env(safe-area-inset-top, 0px)); }
  #inv { top: calc(122px + env(safe-area-inset-top, 0px)); }
  #help { display: none; }
  #mini canvas { width: 120px; height: 120px; }
  #tools button { font-size: 14px; padding: 0 10px; }
}
@media (prefers-reduced-motion: reduce) { button:active { transform: none; } }
</style>

<canvas id="game" aria-label="MP 2026 세계 지도"></canvas>

<div id="where" class="hud card" aria-live="polite">
  <div class="name" id="whereName">우리 수도</div>
  <div class="sub" id="whereSub"></div>
  <div class="chips" id="whereChips"></div>
</div>

<div id="doom" class="hud card">
  <div class="row"><span id="doomL">아직은 평화로운 세계</span><span class="d" id="doomD">1일차</span><span id="doomR">12/14 · 건국기</span></div>
  <div class="bar" id="doomBar" hidden><div id="doomFill"></div></div>
</div>

<div id="tools" class="hud">
  <button id="btnWar" type="button">전쟁 (B)</button>
  <button id="btnMap" type="button">지도 (M)</button>
  <button id="btnHome" type="button">우리 수도 (T)</button>
  <button id="btnCoupon" type="button">쿠폰</button>
  <button id="btnCloset" type="button">꾸미기</button>
</div>

<div id="inv" class="hud card" aria-label="보유 자원">
  <span class="invc"><img src="assets/extra/coin.png" alt="코인" width="18" height="18"> <span id="invCoin">0</span></span>
  <span><b>병력</b> <span id="invArmy">0</span></span>
  <span><b>백신</b> <span id="invVac">0</span></span>
</div>

<div id="skyTimer" class="hud card" hidden>하늘 체류 <b id="skyLeft">5:00</b> 남음</div>

<div id="mini" class="hud card">
  <canvas id="miniCanvas" width="336" height="336" aria-label="미니맵, 누르면 그 위치로 이동(테스트)"></canvas>
  <div class="cap">누르면 순간이동 (테스트용)</div>
</div>

<div id="chat" class="hud card" hidden>
  <div class="chathead" id="netText">오프라인</div>
  <div id="chatLog" class="chatlog" aria-live="polite"></div>
  <div class="chatrow"><input id="chatIn" type="text" maxlength="120" placeholder="우리 나라 채팅 (Enter)" autocomplete="off"><button id="btnChatSend" type="button">보내기</button></div>
</div>

<div id="help" class="hud card">WASD·방향키 이동 · E 포털·금광·제단 · Shift 빨리 걷기 · 휠 확대/축소 · 1~8 감정표현 · [ ] 날짜 바꾸기 (테스트)</div>

<div id="prompt" class="hud card" hidden><span id="promptText">제단</span><kbd>E</kbd></div>
<div id="toast" class="hud" hidden></div>

<div id="bigmap" hidden>
  <div class="panel card">
    <div class="head"><h2>세계 지도</h2><button id="btnMapClose" type="button">닫기</button></div>
    <canvas id="bigCanvas" width="720" height="720" aria-label="세계 지도, 누르면 그 위치로 이동(테스트)"></canvas>
    <div class="legend" id="legend"></div>
  </div>
</div>

<div id="closet" hidden>
  <div class="panel card">
    <h2>캐릭터 꾸미기</h2>
    <div><label for="nick">닉네임</label><input id="nick" type="text" maxlength="10" value="나"></div>
    <div><label>캐릭터 (동아리 16종 + 88종)</label><div class="swatches" id="hairSw"></div></div>
    <div><label>색 바꾸기</label><div class="swatches" id="outfitSw"></div></div>
    <div><label>헤어스타일</label><div class="seg" id="lenSeg"><button type="button" data-long="0">짧은 머리</button><button type="button" data-long="1">긴 머리</button></div></div>
    <button id="btnClosetDone" type="button">완료</button>
  </div>
</div>

<div id="coupon" hidden>
  <div class="panel card">
    <h2>쿠폰 코드</h2>
    <div><label for="couponIn">코드</label><input id="couponIn" type="text" maxlength="14" placeholder="MP-AB12-CD34" autocomplete="off" spellcheck="false"></div>
    <p id="couponMsg" class="msg"></p>
    <div class="seg"><button id="btnCouponUse" type="button">사용하기</button><button id="btnCouponClose" type="button">닫기</button></div>
  </div>
</div>

<div id="join" hidden>
  <div class="panel card">
    <h2>MP 2026 입장</h2>
    <div><label for="joinNick">닉네임</label><input id="joinNick" type="text" maxlength="10" autocomplete="off"></div>
    <div><label for="joinTeam">팀 번호 (테스트용, 나중엔 학번 로그인)</label><input id="joinTeam" type="number" min="1" max="60" value="1"></div>
    <button id="btnJoin" type="button">입장하기</button>
  </div>
</div>

<div id="wanderBox" hidden>
  <div class="panel card">
    <h2>유랑민 등록소</h2>
    <p id="wanderMsg" class="msg"></p>
    <div><label for="wanderTarget">귀화할 나라 (팀 번호)</label><input id="wanderTarget" type="text" maxlength="12" autocomplete="off"></div>
    <div class="seg wrap"><button id="btnNat" type="button">귀화 신청</button><button id="btnMerc" type="button">용병 등록</button><button id="btnFound" type="button">건국 대기 (4명)</button></div>
    <div><label>지금 등록한 사람들</label><div id="wanderList" class="wlist"></div></div>
    <div class="seg"><button id="btnWanderCancel" type="button">내 등록 취소</button><button id="btnWanderClose" type="button">닫기</button></div>
  </div>
</div>

<div id="war" hidden>
  <div class="panel card">
    <div class="head"><h2>전쟁 · 블로토</h2><button id="btnWarClose" type="button">닫기</button></div>
