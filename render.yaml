# Render 블루프린트: GitHub 저장소를 연결하면 이 설정으로 서버가 만들어진다.
# 무료 플랜 + MongoDB Atlas 무료 저장소 (docs/DEPLOY.md 참고)
services:
  - type: web
    name: mp2026
    runtime: node
    region: singapore
    plan: free
    rootDir: .
    buildCommand: cd server && npm ci
    startCommand: node server/index.js
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: MONGODB_URI     # Atlas 연결 문자열: Render 화면에서 직접 넣는다 (저장소에 적지 않음)
        sync: false
      - key: MONGODB_DB
        value: mp2026
      - key: ADMIN_KEY       # 관리자 화면(/admin) 비밀번호: Render 화면에서 직접 넣는다 (저장소에 적지 않음)
        sync: false
      - key: TEST_MODE       # 행사 시작 전 '0' 으로 바꾸면 '지금 전투 처리' 버튼이 사라짐
        value: "1"
